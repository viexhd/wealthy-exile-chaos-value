name: Release

# Push a tag such as v1.0.1 to run this. The tag must match the version in manifest.json.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - run: npm test
      - run: npm run lint
      - run: npm run build

      # Safe to re-run: an existing release just gets its zip replaced.
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls dist/*.zip)
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            notes=$(node scripts/release-notes.js "${GITHUB_REF_NAME#v}")
            gh release create "$GITHUB_REF_NAME" "$zip" --title "$GITHUB_REF_NAME" --notes "$notes"
          fi

      # Only runs once AMO_API_KEY and AMO_API_SECRET are set as repository secrets.
      # Submits the version to addons.mozilla.org for review without waiting for the result.
      - name: Submit to addons.mozilla.org
        if: env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        run: >
          npx web-ext sign
          --channel listed
          --amo-metadata amo-metadata.json
          --approval-timeout 0
          --api-key "$AMO_API_KEY"
          --api-secret "$AMO_API_SECRET"
